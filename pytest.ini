[pytest]
# 默认只在 tests 下收集用例,避免去扫 data/(3.3GB dump)和 .venv/
testpaths = tests

# 把 src 加进 sys.path。
# 为什么:src 下的模块用的是扁平导入(offline/parse.py 里写 from common import config),
# 这要求 src 目录本身在 sys.path 上,而不是项目根。
# ⚠ pythonpath 这个配置项要 pytest >= 7.0 才支持,所以 requirements.txt 下限写 8.0。
# (tests/conftest.py 里还有一道 sys.path.insert 兜底,双保险。)
pythonpath = src

# -ra:结束时把所有非 PASS 的结果连同"原因"一起汇总打印(skip 原因一目了然)。
# 本项目占位用例多,没有 -ra 就只看到一堆 s,看不出为什么跳过。
addopts = -ra

# 自定义标记登记。不登记的话 pytest 会报 PytestUnknownMarkWarning;
# 登记后 `pytest --markers` 也能查到每个标记的含义。
markers =
    unit: 纯函数级单测,不读大文件、不联网、不花钱
    integration: 跨模块串联,可能读 data/ 下的真实产物
    network: 需要 Ollama 服务或 Qwen API(调 Qwen 会花钱,务必默认跳过)
    bigdata: 需要 E 盘 data/articles/wiki_zh.jsonl(2.32GB),慢
    slow: 单条用例超过 10 秒
